[package]
name = "bpond"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
authors = ["miso-devel <kengo279@icloud.com>"]
description = "A living pond in your terminal — koi, frogs, and lily pads rendered in Unicode braille."
license = "MIT"
repository = "https://github.com/miso-devel/bpond"
homepage = "https://github.com/miso-devel/bpond"
readme = "README.md"
keywords = ["terminal", "tui", "animation", "ratatui", "braille"]
categories = ["command-line-utilities", "visualization"]
exclude = [
    "assets/*",
    "CLAUDE.md",
    ".github/",
    ".editorconfig",
]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
